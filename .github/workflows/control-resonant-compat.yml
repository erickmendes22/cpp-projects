name: Adreno A830 source compatibility patch validation
on:
  push:
    branches: [control-resonant-dgc-a830]
    paths: ["control-resonant/a830-compat/**", ".github/workflows/control-resonant-compat.yml"]
  workflow_dispatch:
jobs:
  patch-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch A830 26.3 source
        run: git clone --depth=1 --branch turnip/gen8 https://github.com/whitebelyash/mesa-unified.git mesa
      - name: Apply original feature-preserving A830 patches
        run: |
          set -eu
          cd mesa
          for p in ../control-resonant/a830-compat/*.patch; do
            echo "CHECK $p"
            git apply --check "$p"
            git apply "$p"
          done
          test -s src/freedreno/vulkan/tu_mesh.cc
          grep -q "tu_mesh.cc" src/freedreno/vulkan/meson.build
          git diff --stat
