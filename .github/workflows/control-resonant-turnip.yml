name: CONTROL Resonant A830 - Turnip DGC integration compile

on:
  push:
    branches: [control-resonant-dgc-a830]
    paths: ["control-resonant/turnip-overlays/**", ".github/workflows/control-resonant-turnip.yml"]
  workflow_dispatch:

jobs:
  compile-dgc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld patchelf flex bison glslang-tools spirv-tools git python3-pip pkg-config ccache unzip curl libdrm-dev zip
          python3 -m pip install --user --break-system-packages 'meson>=1.4' mako
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Mesa A830 source and full feature patches
        run: |
          set -euo pipefail
          git clone --depth=1 --branch main https://gitlab.freedesktop.org/mesa/mesa.git mesa
          git -C mesa fetch --depth=1 origin 4da08cb8adfbdc103bc517b45040a19957b7404d
          git -C mesa checkout --detach FETCH_HEAD
          cd mesa
          for p in ../control-resonant/a830-compat/*.patch; do
            patch -p1 -N --fuzz=3 --no-backup-if-mismatch < "$p"
          done
          test -s src/freedreno/vulkan/tu_mesh.cc
          grep -q 'tu_mesh.cc' src/freedreno/vulkan/meson.build
          grep -q 'EXT_mesh_shader = tu_has_mesh_shader(device)' src/freedreno/vulkan/tu_device.cc
      - name: Inject Vulkan DGC prototype
        shell: bash
        run: |
          set -euo pipefail
          cp control-resonant/turnip-overlays/tu_dgc_a830.{h,cc} mesa/src/freedreno/vulkan/
          cp control-resonant/turnip-overlays/tu_dgc_bridge.c mesa/src/freedreno/vulkan/
          glslangValidator -V --target-env vulkan1.2 -S comp control-resonant/dgc_pm4_layout.comp -o /tmp/tu_dgc_a830.spv
          spirv-val --target-env vulkan1.2 /tmp/tu_dgc_a830.spv
          python3 - <<'PY'
          from pathlib import Path
          import struct
          v=Path("mesa/src/freedreno/vulkan")
          m=v/"meson.build"
          s=m.read_text()
          anchor="  'tu_device.cc',"
          assert anchor in s
          m.write_text(s.replace(anchor, anchor+"\n  'tu_dgc_a830.cc',\n  'tu_dgc_bridge.c',",1))
          h=v/"tu_device.h"
          s=h.read_text()
          anchor="struct tu_device\n{\n   struct vk_device vk;"
          assert anchor in s
          h.write_text(s.replace(anchor,anchor+"\n   VkPipeline dgc_a830_pipeline;\n   VkPipelineLayout dgc_a830_pipeline_layout;",1))
          d=v/"tu_device.cc"
          s=d.read_text()
          anchor="   tu_destroy_clear_blit_shaders(device);"
          assert anchor in s
          s='#include "tu_dgc_a830.h"\n'+s.replace(anchor,"   tu_dgc_a830_finish(device);\n"+anchor,1)
          d.write_text(s)
          b=Path("/tmp/tu_dgc_a830.spv").read_bytes()
          words=struct.unpack("<%dI"%(len(b)//4),b)
          (v/"tu_dgc_a830_spv.h").write_text("#pragma once\n#include <stdint.h>\nstatic const uint32_t tu_dgc_a830_spv[] = {\n"+
             "\n".join("  "+", ".join(f"0x{x:08x}u" for x in words[i:i+8])+","
                       for i in range(0,len(words),8))+"\n};\n")
          print("Embedded DGC GPU preprocessor",len(b),"bytes")
          PY
      - name: Android NDK r29
        run: |
          curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r29-linux.zip -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp
      - name: Cross compile
        run: |
          set -euo pipefail
          NDK=/tmp/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin
          cat > mesa/android-aarch64.txt <<EOF
          [binaries]
          ar = '$NDK/llvm-ar'
          c = ['$NDK/clang', '--target=aarch64-linux-android35']
          cpp = ['$NDK/clang++', '--target=aarch64-linux-android35', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++']
          c_ld = '$NDK/ld.lld'
          cpp_ld = '$NDK/ld.lld'
          strip = '$NDK/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=$NDK/pkg-config', '/usr/bin/pkg-config']
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
          cd mesa
          meson setup build-android-aarch64 --cross-file android-aarch64.txt --prefix /tmp/turnip-control -Dbuildtype=release -Dstrip=true -Dcpp_args=-Wno-c++11-narrowing -Dplatforms=android -Dvideo-codecs= -Dplatform-sdk-version=36 -Dandroid-stub=true -Dgallium-drivers= -Dvulkan-drivers=freedreno -Dvulkan-beta=true -Dfreedreno-kmds=kgsl -Degl=disabled -Dandroid-libbacktrace=disabled
          ninja -j3 -C build-android-aarch64 install
          test -s /tmp/turnip-control/lib/libvulkan_freedreno.so
          $NDK/llvm-readelf -sW /tmp/turnip-control/lib/libvulkan_freedreno.so | grep 'tu_CreateIndirectCommandsLayoutEXT'
# Prototype binary is not published because GPU DGC dispatch not yet integrated.
