name: CONTROL Resonant A830 - Turnip DGC integration compile
on:
  workflow_dispatch:
  push:
    branches:
      - control-resonant-dgc-a830
    paths:
      - .github/workflows/control-resonant-turnip.yml

concurrency:
  group: control-resonant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-dgc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld patchelf flex bison glslang-tools spirv-tools git python3-pip pkg-config ccache unzip curl libdrm-dev zip
          python3 -m pip install --user --break-system-packages 'meson>=1.4' mako
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Mesa A830 source and full feature patches
        run: |
          set -euo pipefail
          git clone --depth=1 --branch main https://gitlab.freedesktop.org/mesa/mesa.git mesa
          git -C mesa fetch --depth=1 origin 4da08cb8adfbdc103bc517b45040a19957b7404d
          git -C mesa checkout --detach FETCH_HEAD
          cd mesa
          for p in ../control-resonant/a830-compat/*.patch; do
            patch -p1 -N --fuzz=3 --no-backup-if-mismatch < "$p"
          done
          test -s src/freedreno/vulkan/tu_mesh.cc
          grep -q 'tu_mesh.cc' src/freedreno/vulkan/meson.build
          grep -q 'EXT_mesh_shader = tu_has_mesh_shader(device)' src/freedreno/vulkan/tu_device.cc
      - name: Inject Vulkan DGC prototype
        shell: bash
        run: |
          set -euo pipefail
          cp control-resonant/turnip-overlays/tu_dgc_a830.{h,cc} mesa/src/freedreno/vulkan/
          cp control-resonant/turnip-overlays/tu_dgc_bridge.c mesa/src/freedreno/vulkan/
          cp control-resonant/turnip-overlays/tu_dgc_a830_cmd.inc mesa/src/freedreno/vulkan/
          glslangValidator -V --target-env vulkan1.2 -S comp control-resonant/dgc_pm4_layout.comp -o /tmp/tu_dgc_a830.spv
          spirv-val --target-env vulkan1.2 /tmp/tu_dgc_a830.spv
          python3 - <<'PY'
          from pathlib import Path
          import struct
          v=Path("mesa/src/freedreno/vulkan")
          m=v/"meson.build"
          s=m.read_text()
          anchor="  'tu_device.cc',"
          assert anchor in s
          m.write_text(s.replace(anchor, anchor+"\n  'tu_dgc_a830.cc',\n  'tu_dgc_bridge.c',",1))
          h=v/"tu_device.h"
          s=h.read_text()
          anchor="struct tu_device\n{\n   struct vk_device vk;"
          assert anchor in s
          h.write_text(s.replace(anchor,anchor+"\n   VkPipeline dgc_a830_pipeline;\n   VkPipelineLayout dgc_a830_pipeline_layout;",1))
          d=v/"tu_device.cc"
          s=d.read_text()
          anchor="   tu_destroy_clear_blit_shaders(device);"
          assert anchor in s
          s='#include "tu_dgc_a830.h"\n'+s.replace(anchor,"   tu_dgc_a830_finish(device);\n"+anchor,1)
          d.write_text(s)
          c=v/"tu_cmd_buffer.cc"
          source=c.read_text()
          entry="TU_GENX(tu_CmdDispatchIndirect);"
          assert entry in source
          c.write_text(source.replace(entry,
                       entry+"\n#include \"tu_dgc_a830_cmd.inc\"",1))
          b=Path("/tmp/tu_dgc_a830.spv").read_bytes()
          words=struct.unpack("<%dI"%(len(b)//4),b)
          (v/"tu_dgc_a830_spv.h").write_text("#pragma once\n#include <stdint.h>\nstatic const uint32_t tu_dgc_a830_spv[] = {\n"+
             "\n".join("  "+", ".join(f"0x{x:08x}u" for x in words[i:i+8])+","
                       for i in range(0,len(words),8))+"\n};\n")
          print("Embedded DGC GPU preprocessor",len(b),"bytes")
          PY
          python3 control-resonant/turnip-overlays/enable_dgc_a830.py
      - name: Android NDK r29
        run: |
          curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r29-linux.zip -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp
      - name: Cross compile
        run: |
          set -euo pipefail
          NDK=/tmp/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin
          cat > mesa/android-aarch64.txt <<EOF
          [binaries]
          ar = '$NDK/llvm-ar'
          c = ['$NDK/clang', '--target=aarch64-linux-android35']
          cpp = ['$NDK/clang++', '--target=aarch64-linux-android35', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++']
          c_ld = '$NDK/ld.lld'
          cpp_ld = '$NDK/ld.lld'
          strip = '$NDK/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=$NDK/pkg-config', '/usr/bin/pkg-config']
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
          cd mesa
          meson setup build-android-aarch64 --cross-file android-aarch64.txt --prefix /tmp/turnip-control -Dbuildtype=release -Dstrip=true -Dcpp_args=-Wno-c++11-narrowing -Dplatforms=android -Dvideo-codecs= -Dplatform-sdk-version=36 -Dandroid-stub=true -Dgallium-drivers= -Dvulkan-drivers=freedreno -Dvulkan-beta=true -Dfreedreno-kmds=kgsl -Degl=disabled -Dandroid-libbacktrace=disabled
          ninja -j3 -C build-android-aarch64 install
          test -s /tmp/turnip-control/lib/libvulkan_freedreno.so
          # A stripped installation library cannot expose hidden TU_GENX instances.
          # Check actual defined symbols in the pre-strip linked binary instead.
          # This step has already run 'cd mesa'; do not prefix 'mesa/' again.
          UNSTRIPPED=build-android-aarch64/src/freedreno/vulkan/libvulkan_freedreno.so
          if [ ! -s "$UNSTRIPPED" ]; then
            echo "ERROR: missing unstripped Turnip library at $(pwd)/$UNSTRIPPED"
            find build-android-aarch64/src/freedreno/vulkan -maxdepth 1 -name '*.so' -print
            exit 1
          fi
          "$NDK/llvm-readelf" -sW "$UNSTRIPPED" > /tmp/a830-unstripped-symbols.txt

      - name: Verify generated DGC driver entrypoints
        shell: bash
        run: |
          set -euo pipefail
          DRIVER=/tmp/turnip-control/lib/libvulkan_freedreno.so
          test -s "$DRIVER"
          NDK=/tmp/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin
          "$NDK/llvm-readelf" -sW "$DRIVER" > /tmp/turnip-symbols.txt
          # Hidden template instances are absent from the stripped ELF symbol
          # table, but must be DEFINED in the unstripped linked driver.
          for symbol in tu_CreateIndirectCommandsLayoutEXT tu_DestroyIndirectCommandsLayoutEXT tu_GetGeneratedCommandsMemoryRequirementsEXT tu_CmdExecuteGeneratedCommandsEXT tu_CmdPreprocessGeneratedCommandsEXT; do
            if ! awk -v sym="$symbol" '$7 != "UND" && index($8,sym) { found=1 } END { exit !found }' /tmp/a830-unstripped-symbols.txt; then
              echo "ERROR: A830 DGC entrypoint not defined: $symbol"
              exit 1
            fi
          done
          # Weak UND references silently survive linking and crash at dispatch.
          if awk '$7 == "UND" && $8 ~ /tu_(CreateIndirectCommandsLayoutEXT|DestroyIndirectCommandsLayoutEXT|GetGeneratedCommandsMemoryRequirementsEXT|CmdExecuteGeneratedCommandsEXT|CmdPreprocessGeneratedCommandsEXT)/ { print; bad=1 } END { exit !bad }' /tmp/turnip-symbols.txt; then
            echo 'ERROR: unresolved A830 Vulkan DGC entrypoint template(s)'
            exit 1
          fi
          grep -q 'deviceGeneratedCommands' mesa/src/freedreno/vulkan/tu_device.cc
          grep -q 'tu_cs_set_writeable(stream, true)' mesa/src/freedreno/vulkan/tu_dgc_a830_cmd.inc
          echo 'A830 DGC code and Vulkan registration included in Android binary'

      - name: Package experimental driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/control-turnip
          cp /tmp/turnip-control/lib/libvulkan_freedreno.so /tmp/control-turnip/
          cat > /tmp/control-turnip/meta.json <<'EOF'
          {
            "schemaVersion": 1,
            "name": "Turnip A830 CONTROL DGC experimental",
            "description": "A830 GPU generated draw commands prototype. Hardware validation required.",
            "author": "erickmendes22",
            "packageVersion": "8",
            "vendor": "Mesa",
            "driverVersion": "Vulkan 1.4.359",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF
          python3 -m json.tool /tmp/control-turnip/meta.json >/dev/null
          cd /tmp/control-turnip
          zip -9 /tmp/CONTROL_Resonant_A830_Turnip_DGC_experimental.zip libvulkan_freedreno.so meta.json
          unzip -t /tmp/CONTROL_Resonant_A830_Turnip_DGC_experimental.zip

      - name: Upload experimental Turnip test build
        uses: actions/upload-artifact@v4
        with:
          name: CONTROL-Resonant-A830-Turnip-DGC-experimental
          path: /tmp/CONTROL_Resonant_A830_Turnip_DGC_experimental.zip
          if-no-files-found: error

